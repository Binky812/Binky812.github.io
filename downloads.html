<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloads | Binky812</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 70rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .top-links {
        margin-bottom: 1rem;
      }
      .top-links a {
        text-underline-offset: 0.2em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }
      .card {
        border: 1px solid #8b8b8b55;
        border-radius: 0.75rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
      }
      .filename {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
        font-size: 0.9rem;
      }
      .download-btn {
        margin-top: auto;
        align-self: start;
        display: inline-block;
        padding: 0.5rem 0.85rem;
        border-radius: 0.5rem;
        text-decoration: none;
        border: 1px solid currentColor;
        font-weight: 600;
      }
      .download-btn:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      #status {
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="top-links" aria-label="Site">
        <a href="./index.html">← Back to Home</a>
      </nav>
      <h1>Downloadable Files</h1>
      <p id="status" role="status" aria-live="polite">Loading files…</p>
      <section id="downloads-list" class="grid" aria-label="Available downloads"></section>
    </main>
    <script>
      function safePath(path) {
        return String(path || "").replace(/^\/+/, "");
      }

      function createFileCard(file) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = file.displayName || "Untitled file";

        const description = document.createElement("p");
        description.textContent = file.description || "No description provided.";

        const fileName = document.createElement("p");
        fileName.className = "filename";
        fileName.textContent = `File name: ${file.fileName || "Unknown"}`;

        const link = document.createElement("a");
        link.className = "download-btn";
        link.href = "./" + safePath(file.downloadPath);
        link.download = file.fileName || "";
        link.textContent = "Download";
        link.setAttribute("aria-label", `Download ${file.displayName || file.fileName || "file"}`);

        card.append(title, description, fileName, link);
        return card;
      }

      async function renderDownloads() {
        const status = document.getElementById("status");
        const list = document.getElementById("downloads-list");
        try {
          const response = await fetch("./downloads.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Could not load downloads metadata.");

          const files = await response.json();
          if (!Array.isArray(files) || files.length === 0) {
            status.textContent = "No downloadable files are listed yet.";
            return;
          }

          files.forEach((file) => list.appendChild(createFileCard(file)));
          status.textContent = `${files.length} file${files.length === 1 ? "" : "s"} available.`;
        } catch (error) {
          status.textContent = "Unable to load download list right now.";
        }
      }

      renderDownloads();
    </script>
  </body>
</html>
